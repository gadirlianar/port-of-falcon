<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <rect width="64" height="64" rx="16" fill="#020617" />
  <rect x="1" y="1" width="62" height="62" rx="15" stroke="#0EA5E9" stroke-opacity="0.4" stroke-width="2" />
  
  <defs>
    <linearGradient id="fav-falcon-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="50%" stop-color="#0EA5E9" />
      <stop offset="100%" stop-color="#6366F1" />
    </linearGradient>
  </defs>

  <!-- Scaled Falcon Glyph centered in 64x64 -->
  <g transform="translate(10, 10) scale(0.44)">
    <!-- Central Head & Core -->
    <polygon points="50,14 56,36 50,44 44,36" fill="url(#fav-falcon-grad)" />
    <polygon points="50,46 59,58 50,72 41,58" fill="url(#fav-falcon-grad)" />
    <polygon points="50,51 55,58 50,66 45,58" fill="#020617" />

    <!-- Left Wings -->
    <polygon points="46,38 18,48 6,66 32,58 44,48" fill="url(#fav-falcon-grad)" />
    <polygon points="42,50 20,62 12,78 36,68 44,56" fill="url(#fav-falcon-grad)" opacity="0.8" />
    <polygon points="41,60 26,72 20,84 38,76 43,64" fill="url(#fav-falcon-grad)" opacity="0.6" />

    <!-- Right Wings -->
    <polygon points="54,38 82,48 94,66 68,58 56,48" fill="url(#fav-falcon-grad)" />
    <polygon points="58,50 80,62 88,78 64,68 56,56" fill="url(#fav-falcon-grad)" opacity="0.8" />
    <polygon points="59,60 74,72 80,84 62,76 57,64" fill="url(#fav-falcon-grad)" opacity="0.6" />

    <!-- Tail -->
    <polygon points="50,74 54,88 50,94 46,88" fill="url(#fav-falcon-grad)" />
  </g>
</svg>
