<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="falcon-primary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="45%" stop-color="#0EA5E9" />
      <stop offset="100%" stop-color="#6366F1" />
    </linearGradient>
    <linearGradient id="falcon-accent" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>
    <filter id="falcon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Central Interceptor Cockpit & Beak -->
  <polygon points="50,14 56,36 50,44 44,36" fill="url(#falcon-primary)" />
  
  <!-- Central Diamond Core -->
  <polygon points="50,46 59,58 50,72 41,58" fill="url(#falcon-primary)" />
  <polygon points="50,51 55,58 50,66 45,58" fill="#020617" />

  <!-- Supersonic Forward Swept Main Wings -->
  <!-- Left Wing Primary Feather -->
  <polygon points="46,38 18,48 6,66 32,58 44,48" fill="url(#falcon-primary)" filter="url(#falcon-glow)" />
  <!-- Left Wing Secondary Feather -->
  <polygon points="42,50 20,62 12,78 36,68 44,56" fill="url(#falcon-accent)" opacity="0.85" />
  <!-- Left Wing Tertiary Flap -->
  <polygon points="41,60 26,72 20,84 38,76 43,64" fill="url(#falcon-primary)" opacity="0.6" />

  <!-- Right Wing Primary Feather -->
  <polygon points="54,38 82,48 94,66 68,58 56,48" fill="url(#falcon-primary)" filter="url(#falcon-glow)" />
  <!-- Right Wing Secondary Feather -->
  <polygon points="58,50 80,62 88,78 64,68 56,56" fill="url(#falcon-accent)" opacity="0.85" />
  <!-- Right Wing Tertiary Flap -->
  <polygon points="59,60 74,72 80,84 62,76 57,64" fill="url(#falcon-primary)" opacity="0.6" />

  <!-- Aerodynamic Tail Stabilizer -->
  <polygon points="50,74 54,88 50,94 46,88" fill="url(#falcon-primary)" />
  <line x1="50" y1="20" x2="50" y2="92" stroke="#00F0FF" stroke-width="1.2" stroke-linecap="round" opacity="0.7" />
</svg>
