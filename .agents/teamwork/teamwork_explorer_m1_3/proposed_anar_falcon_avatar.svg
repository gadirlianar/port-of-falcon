<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" fill="none">
  <defs>
    <radialGradient id="bg-glow" cx="50%" cy="45%" r="50%">
      <stop offset="0%" stop-color="#0EA5E9" stop-opacity="0.25" />
      <stop offset="40%" stop-color="#6366F1" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#020617" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="suit-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="50%" stop-color="#090D16" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="neon-cyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="100%" stop-color="#0EA5E9" />
    </linearGradient>
    <linearGradient id="neon-indigo" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#818CF8" />
      <stop offset="100%" stop-color="#6366F1" />
    </linearGradient>
    <linearGradient id="visor-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#6366F1" stop-opacity="0.85" />
    </linearGradient>
    <linearGradient id="skin-shadow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#C29B7F" />
      <stop offset="100%" stop-color="#8C654D" />
    </linearGradient>
    <filter id="laser-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Ambient Backdrop Glow -->
  <circle cx="400" cy="380" r="360" fill="url(#bg-glow)" />

  <!-- High-Tech Telemetry HUD Radar Circles -->
  <circle cx="400" cy="380" r="340" stroke="#0EA5E9" stroke-opacity="0.15" stroke-width="1.5" stroke-dasharray="6 8" />
  <circle cx="400" cy="380" r="280" stroke="#6366F1" stroke-opacity="0.2" stroke-width="1.2" />
  <circle cx="400" cy="380" r="210" stroke="#00F0FF" stroke-opacity="0.25" stroke-width="1" stroke-dasharray="14 10" />

  <!-- Reticle Ticks & Coordinates -->
  <line x1="400" y1="20" x2="400" y2="60" stroke="#0EA5E9" stroke-opacity="0.4" stroke-width="2" />
  <line x1="400" y1="700" x2="400" y2="740" stroke="#0EA5E9" stroke-opacity="0.4" stroke-width="2" />
  <line x1="40" y1="380" x2="80" y2="380" stroke="#0EA5E9" stroke-opacity="0.4" stroke-width="2" />
  <line x1="720" y1="380" x2="760" y2="380" stroke="#0EA5E9" stroke-opacity="0.4" stroke-width="2" />

  <!-- Aerospace Coordinates Stamp -->
  <text x="140" y="240" font-family="monospace" font-size="12" fill="#0EA5E9" fill-opacity="0.7" letter-spacing="2">LAT 40.4093°N // LON 49.8671°E</text>
  <text x="560" y="240" font-family="monospace" font-size="12" fill="#6366F1" fill-opacity="0.7" letter-spacing="2">AZINTELECOM TIER III</text>
  <text x="140" y="520" font-family="monospace" font-size="12" fill="#00F0FF" fill-opacity="0.7" letter-spacing="2">OPTICAL LOSS &lt;0.15dB</text>
  <text x="560" y="520" font-family="monospace" font-size="12" fill="#10B981" fill-opacity="0.7" letter-spacing="2">SYS SLA 99.998%</text>

  <!-- Torso & Flight Jacket -->
  <path d="M 230 800 L 260 560 L 320 500 L 400 520 L 480 500 L 540 560 L 570 800 Z" fill="url(#suit-grad)" />
  
  <!-- Outer Aerospace Shoulders -->
  <path d="M 120 800 C 140 680, 200 580, 280 540 L 320 500 L 400 530 L 480 500 L 520 540 C 600 580, 660 680, 680 800 Z" fill="#070B14" stroke="#1E293B" stroke-width="2" />
  
  <!-- Neon Fiber-Optic Conduit Piping along Jacket -->
  <path d="M 220 800 L 270 570 L 330 520 L 390 540" fill="none" stroke="url(#neon-cyan)" stroke-width="3" filter="url(#laser-glow)" />
  <path d="M 580 800 L 530 570 L 470 520 L 410 540" fill="none" stroke="url(#neon-indigo)" stroke-width="3" filter="url(#laser-glow)" />

  <!-- Falcon Insignia Lapel Emblem -->
  <g transform="translate(470, 600) scale(0.35)">
    <polygon points="50,14 56,36 50,44 44,36" fill="#00F0FF" />
    <polygon points="50,46 59,58 50,72 41,58" fill="#0EA5E9" />
    <polygon points="46,38 18,48 6,66 32,58 44,48" fill="#00F0FF" />
    <polygon points="54,38 82,48 94,66 68,58 56,48" fill="#00F0FF" />
  </g>

  <!-- Neck & Collar -->
  <path d="M 345 500 L 345 420 C 345 410, 455 410, 455 420 L 455 500 Z" fill="url(#skin-shadow)" />
  <path d="M 330 500 C 350 535, 450 535, 470 500 L 480 430 L 450 435 L 400 480 L 350 435 L 320 430 Z" fill="#0B132B" stroke="#0EA5E9" stroke-width="1.5" />

  <!-- Head & Hair Silhouette -->
  <!-- Jaw & Face -->
  <path d="M 320 320 C 320 430, 350 470, 400 470 C 450 470, 480 430, 480 320 C 480 250, 450 200, 400 200 C 350 200, 320 250, 320 320 Z" fill="#BA8F72" />
  <!-- Shadow / Contour -->
  <path d="M 320 340 C 340 440, 360 465, 400 468 C 385 450, 375 410, 375 350 Z" fill="#9C6F54" opacity="0.4" />
  <!-- Hair -->
  <path d="M 315 290 C 315 220, 340 180, 400 175 C 460 180, 485 220, 485 290 C 480 260, 460 230, 400 230 C 340 230, 320 260, 315 290 Z" fill="#171A21" />
  <path d="M 315 290 L 330 330 L 332 290 Z" fill="#171A21" />
  <path d="M 485 290 L 470 330 L 468 290 Z" fill="#171A21" />

  <!-- Ears -->
  <path d="M 315 310 C 305 320, 305 345, 320 355 Z" fill="#BA8F72" />
  <path d="M 485 310 C 495 320, 495 345, 480 355 Z" fill="#BA8F72" />

  <!-- Cybernetic Tactical Visor / Smart Glass -->
  <path d="M 325 305 L 475 305 L 465 355 L 400 370 L 335 355 Z" fill="url(#visor-grad)" opacity="0.92" filter="url(#laser-glow)" />
  <path d="M 325 305 L 475 305 L 465 355 L 400 370 L 335 355 Z" fill="none" stroke="#FFFFFF" stroke-width="1.5" opacity="0.8" />
  <line x1="335" y1="325" x2="465" y2="325" stroke="#00F0FF" stroke-width="1" stroke-dasharray="4 4" />
  <text x="350" y="342" font-family="monospace" font-size="11" fill="#FFFFFF" font-weight="bold" letter-spacing="1">FALCON-OS v4.2</text>
  <circle cx="450" cy="338" r="3" fill="#00F0FF" />

  <!-- Nose & Mouth Definition beneath Visor -->
  <path d="M 395 375 L 400 395 L 405 375" stroke="#7A523A" stroke-width="2" stroke-linecap="round" />
  <!-- Controlled Confident Smile -->
  <path d="M 380 420 Q 400 430 420 420" stroke="#68422C" stroke-width="2.5" stroke-linecap="round" fill="none" />
  <!-- Well-groomed subtle beard contour -->
  <path d="M 345 370 C 355 440, 380 460, 400 460 C 420 460, 445 440, 455 370" fill="none" stroke="#252A36" stroke-width="4" stroke-dasharray="2 3" opacity="0.4" />
</svg>
